name: tests

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

# Cancel an in-flight run when a new commit is pushed to the same branch.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Required: lib/content/content-index.json is generated at build time and
      # the loader tests assert it exists. The `npm ci` prepare hook only sets
      # up the git hooks path, not the content index.
      - name: Build content index
        run: npm run prebuild

      - name: TypeScript typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Vitest
        run: npx vitest run

      - name: ESLint
        run: npm run lint

      # Block raw Tailwind palette utilities (bg-emerald-900, text-amber-300,
      # etc.) — they don't theme-adapt. See scripts/check-no-raw-palette.sh
      # for the rationale (recent Tarabalam regression).
      - name: Theme-token gate (no raw Tailwind palette)
        run: npm run check:palette
